# ==========================================
# 1. 공통 설정 (Default Profile)
# ==========================================
spring:
  application:
    name: backend
  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  # 기본 활성화할 프로필 지정 (실행 시 지정 안 했을 때 적용)
  profiles:
    active: local

# 파일 저장 경로 설정 (크로스 플랫폼 호환)
# OS별 홈 디렉터리 경로 예시:
# - Windows: C:/Users/{Username}/app-files
# - Mac/Linux: /Users/{Username}/app-files 또는 /home/{Username}/app-files
# - Prod: .env의 FILE_UPLOAD_DIR가 있으면 우선 사용, 없으면 user.home 사용
file:
  upload:
    base-dir: ${FILE_UPLOAD_DIR:${user.home}/app-files}
    sub-dir:
      exams: ${file.upload.base-dir}/exams
      attendances: ${file.upload.base-dir}/attendances

# Swagger 공통 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Kakao 설정
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  redirect-uri: ${KAKAO_REDIRECT_URI}

---
# ==========================================
# 2. Local 환경 설정 (개발 PC)
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL}?sslmode=disable
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

# P6Spy 설정 (로컬 개발용 로그)
decorator:
  datasource:
    p6spy:
      enable-logging: true

p6spy:
  config:
    logfile: p6spy.log
    appender: com.p6spy.engine.spy.appender.StdoutLogger
    log-format: "%{connectionId}|%{executionTime}ms|%{category}|connection%{connectionId}|%{sqlSingleLine}"

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

---
# ==========================================
# 3. Dev / Prod 환경 설정 (배포 서버)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}?sslmode=require
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 운영 환경은 테이블 구조 자동 변경 금지
    show-sql: false        # 운영 환경은 SQL 출력 비활성화

server:
  port: ${PROD_SERVER_PORT:8080}

# P6Spy 비활성화 (운영 성능 보호)
decorator:
  datasource:
    p6spy:
      enable-logging: false

logging:
  level:
    root: INFO
